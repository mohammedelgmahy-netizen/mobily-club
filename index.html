<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060A14">
<title>موبايلي - Mobily</title>
<meta property="og:title" content="موبايلي - Mobily">
<meta property="og:description" content="كارت الولاء بتاعك من موبايلي">
<meta property="og:image" content="https://mohammedelgmahy-netizen.github.io/mobily-club/share-logo.png">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{margin:0;height:100%;background:#060A14;color:#94A3C4;font-family:system-ui,Tahoma,sans-serif}
.l{height:100%;display:grid;place-items:center;text-align:center}.s{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#22D3EE;animation:r .8s linear infinite;margin:0 auto 12px}
@keyframes r{to{transform:rotate(360deg)}}</style>
</head><body><div class="l"><div><div class="s"></div><div id="m">موبايلي - Mobily</div></div></div>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); window.__mcInstallPrompt = e; });
(function(){
  var FN = "https://lhamdnaxioxqptkylvkg.supabase.co/functions/v1/mobily?forceFunctionRegion=ap-south-1";
  var params = {}; new URLSearchParams(location.search).forEach(function(v,k){ params[k]=v; });
  var base = location.href.split('#')[0].split('?')[0];
  // كود المحل من اللينك (?s=code) — من غيره بيفتح محل موبايلي زي ما كان
  window.MC_SHOP = String(params.s || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
  function fail(e){
    var msg = (typeof navigator !== 'undefined' && navigator.onLine === false) ? 'مفيش إنترنت. وصّل الواي فاي أو الداتا'
      : (e && (e.name === 'AbortError')) ? 'الطلب خد وقت طويل'
      : (e && e.message === 'page') ? 'تعذر تحميل الصفحة'
      : 'تعذر الاتصال بالسيرفر';
    document.getElementById('m').innerHTML = msg + ' ثم <a href="" style="color:#22D3EE">أعد المحاولة</a>';
  }
  var V = {"Register":"5f9402dfc6","Card":"777455abea","Unsub":"175c40fd01","Message":"ddd64acd3c","Admin":"e26a78cec8","Signup":"f361907e9c","Shops":"355e17c0c6"};
  var getPage = function(n){ return fetch(base.replace(/[^/]*$/, '') + 'pages/' + n + '.html?v=' + V[n]).then(function(r){ if (!r.ok) throw new Error('page'); return r.text(); }); };
  var guess = params.p === 'admin' ? 'Admin' : params.p === 'unsub' ? 'Unsub' : params.t ? 'Card' : 'Register';
  var early = getPage(guess); early.catch(function(){});
  window.MC_FUNCTION_URL = FN;
  window.__mcPost = function(body){
  var url = window.MC_FUNCTION_URL;
  if (window.MC_SHOP && body && body.charAt(0) === '{' && body.indexOf('"shop"') < 0)
    body = '{"shop":"' + window.MC_SHOP + '"' + (body.length > 2 ? ',' + body.slice(1) : '}');
  var send = function(ct){ var c = window.AbortController ? new AbortController() : null; var t = c ? setTimeout(function(){ c.abort(); }, window.__mcTimeout || (body.length > 200000 ? 120000 : 30000)) : 0; return fetch(url, { method: 'POST', headers: {'Content-Type': ct}, body: body, signal: c ? c.signal : undefined }).then(function(r){ clearTimeout(t); if (r.status >= 400 && r.status !== 500) throw new Error('ct'); return r.json(); }, function(e){ clearTimeout(t); throw e; }); };
  if (window.__mcJson) return send('application/json');
  return send('text/plain;charset=UTF-8').catch(function(e){ if (e && e.name === 'AbortError') throw e; window.__mcJson = true; return send('application/json'); });
};
  // صفحات طبقة المحلات: فتح محل جديد (?p=new) وصفحة المحلات لصاحب البرنامج (?p=shops)
  if (params.p === 'new' || params.p === 'shops') {
    getPage(params.p === 'new' ? 'Signup' : 'Shops').then(function(html){
      document.open(); document.write(html); document.close();
    }).catch(fail);
    return;
  }
  window.__mcPost(JSON.stringify({ fn: 'page', args: [params] }))
    .then(function(j){
      if (!j.result) return fail();
      window.__MC_BOOT__ = j.result.boot || {};
      return (j.result.page === guess ? early : getPage(j.result.page)).then(function(html){
        document.open(); document.write(html); document.close();
        document.title = j.result.title || 'موبايلي - Mobily';
      });
    }).catch(fail);
})();
</script></body></html>
