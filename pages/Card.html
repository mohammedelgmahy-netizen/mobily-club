<style>
:root{
  --bg:#060A14; --bg2:#0B1222; --surface:#0F1830; --surface2:#15213F; --line:rgba(255,255,255,.09);
  --text:#EEF2FF; --muted:#94A3C4; --brand:#22D3EE; --brand2:#8B5CF6; --gold:#F5C451;
  --ok:#34D399; --warn:#FBBF24; --bad:#F87171; --radius:18px;
  --shadow:0 20px 50px -20px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Cairo',system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.6;font-size:15px;
  background-image:radial-gradient(1200px 600px at 110% -10%,rgba(139,92,246,.25),transparent 60%),radial-gradient(900px 500px at -20% 10%,rgba(34,211,238,.16),transparent 60%);
  background-attachment:fixed}
[dir=ltr] body, body[dir=ltr]{font-family:'Inter','Cairo',system-ui,sans-serif}
a{color:var(--brand)}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 40px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Inter',sans-serif;font-weight:800;letter-spacing:.5px}
.logo .mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  background:#fff;box-shadow:0 8px 24px -10px rgba(255,255,255,.35);overflow:hidden}
.logo .mark img{width:40px;height:40px;display:block}
.logo img{height:38px;border-radius:10px}
.hero-logo{background:#fff;border-radius:22px;padding:14px 18px;max-width:230px;margin:2px auto 18px;box-shadow:0 14px 40px -16px rgba(255,255,255,.35)}
.hero-logo.sm{max-width:150px;padding:6px 10px;border-radius:16px;margin-bottom:14px}
.hero-logo img{display:block;width:100%;height:auto}
.logo small{display:block;font-size:10px;letter-spacing:5px;font-weight:700;margin-top:-2px;background:linear-gradient(90deg,#F5C542,#E0A526);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip-btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
h1{font-size:26px;line-height:1.3;margin:6px 0 4px;font-weight:800}
h2{font-size:18px;margin:0 0 10px;font-weight:800}
h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:var(--shadow)}
label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand);flex:0 0 auto;margin:2px 0 0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:13.5px;margin:14px 0;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#06101F;box-shadow:0 12px 30px -12px rgba(34,211,238,.7)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.wa{background:#25D366;color:#062612;box-shadow:0 12px 30px -14px rgba(37,211,102,.8)}
.btn.comm{margin:14px 0 0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#06101F;box-shadow:0 12px 30px -12px rgba(139,92,246,.7)}
.btn.comm svg{width:22px;height:22px}
.btn.sm{width:auto;padding:8px 14px;font-size:13.5px;border-radius:11px}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px}.row>*{flex:1}
.err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);color:#FECACA;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.okmsg{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:#A7F3D0;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.hidden{display:none!important}

/* ---------- Loyalty card ---------- */
.lcard{position:relative;aspect-ratio:1.586;border-radius:22px;padding:18px 20px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,#3B1E78 0%,transparent 55%),radial-gradient(90% 120% at 0% 100%,#0E4A5C 0%,transparent 60%),linear-gradient(135deg,#0B1022,#131A3A 55%,#1B1240);
  box-shadow:0 30px 60px -25px rgba(34,211,238,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
.lcard::before{content:"";position:absolute;inset:-40% -10% auto auto;width:70%;height:140%;transform:rotate(25deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
.lcard::after{content:"";position:absolute;left:-30px;bottom:-60px;width:220px;height:220px;border-radius:50%;
  border:28px solid rgba(34,211,238,.07)}
.lcard .top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.lcard .brand{font-family:'Inter',sans-serif;font-weight:800;font-size:20px;letter-spacing:1.5px;direction:ltr;display:flex;align-items:center;gap:9px}
.lcard .brand .bm{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:#fff;overflow:hidden;display:block}
.lcard .brand .bm img{width:38px;height:38px;display:block}
.lcard .brand span{display:block;font-size:9.5px;letter-spacing:4px;color:#F5C542;font-weight:700}
.lcard .tier{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);letter-spacing:.5px}
.lcard .mid{position:absolute;inset:auto 20px 16px 20px;display:flex;justify-content:space-between;align-items:flex-end;z-index:1;gap:10px}
.lcard .name{font-size:17px;font-weight:800;line-height:1.25;max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .mno{font-family:'Inter',monospace;letter-spacing:2px;font-size:13px;color:#C7D2FE;direction:ltr;text-align:right}
.lcard .pts{font-family:'Inter',sans-serif;font-size:30px;font-weight:800;line-height:1;direction:ltr}
.lcard .pts small{font-family:'Cairo';font-size:11px;font-weight:700;color:var(--muted);display:block;margin-top:4px;text-align:end}
.lcard .chipicon{position:absolute;top:58px;left:20px;width:42px;height:32px;border-radius:7px;z-index:1;
  background:linear-gradient(135deg,#F5D27A,#B8892E);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.lcard .chipicon::before{content:"";position:absolute;inset:7px 10px;border:1.5px solid rgba(0,0,0,.25);border-radius:4px}
.lcard .tag{position:absolute;top:66px;right:20px;font-family:'Inter';font-size:10.5px;color:rgba(255,255,255,.55);letter-spacing:1px;z-index:1;direction:ltr}
.qrbox{background:#fff;border-radius:16px;padding:14px;display:flex;justify-content:center;align-items:center;margin:0 auto;width:max-content}
.qrbox img,.qrbox canvas{display:block}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-family:'Inter',sans-serif;font-size:21px;font-weight:800}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}
.progress{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.reward{display:flex;gap:12px;align-items:center;border-radius:16px;padding:14px;background:linear-gradient(135deg,rgba(245,196,81,.18),rgba(245,196,81,.04));border:1px solid rgba(245,196,81,.35)}
.reward .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--gold);color:#3B2A00;flex:0 0 auto}
.bday{display:flex;gap:12px;align-items:center;margin:16px 0 4px;padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(236,72,153,.22),rgba(245,197,66,.22));border:1px solid rgba(245,197,66,.5)}
.bday.used{opacity:.75}
.bday-ic{font-size:34px;line-height:1}
.offer{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface);margin:10px 0}
.offer img{width:100%;max-height:220px;object-fit:cover;display:block}
.offer .b{padding:12px 14px}
.offer.focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(34,211,238,.2)}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;background:rgba(34,211,238,.14);color:var(--brand)}
.badge.gold{background:rgba(245,196,81,.15);color:var(--gold)}
.badge.red{background:rgba(248,113,113,.15);color:var(--bad)}
.badge.green{background:rgba(52,211,153,.15);color:var(--ok)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:13.5px;padding:8px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--surface2);color:var(--text)}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px dashed var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .l{min-width:0}
.list .it .l div{font-weight:700;font-size:14px}
.list .it .l small{color:var(--muted);font-size:12px}
.pos{color:var(--ok);font-weight:800;font-family:'Inter';direction:ltr}
.neg{color:var(--bad);font-weight:800;font-family:'Inter';direction:ltr}
.empty{color:var(--muted);text-align:center;padding:18px 6px;font-size:13.5px}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--brand);animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.switch{position:relative;width:48px;height:28px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.15);transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(-20px)}
[dir=ltr] .switch input:checked+span::after{transform:translateX(20px)}
details.howto summary{cursor:pointer;font-weight:700}
.fab-wa{position:fixed;bottom:18px;inset-inline-start:18px;width:56px;height:56px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(37,211,102,.7);z-index:20}
.fab-wa svg{width:30px;height:30px;color:#fff}
</style>

</head>

function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var r = google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.ok) resolve(res.data);

    r[fn].apply(r, args);

function esc(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

function fmtNum(n, lang) { return Number(n || 0).toLocaleString(lang === 'en' ? 'en-US' : 'ar-EG-u-nu-latn', { maximumFractionDigits: 2 }); }
function fmtDate(iso, lang, withTime) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return '';
  var o = { year: 'numeric', month: 'short', day: 'numeric' };
  if (withTime) { o.hour = '2-digit'; o.minute = '2-digit'; }
  return d.toLocaleString(lang === 'en' ? 'en-GB' : 'ar-EG-u-nu-latn', o);
}

function renderQR(el, text, size) {
  el.innerHTML = '';
  if (window.QRCode) {
    new QRCode(el, { text: text, width: size || 180, height: size || 180, colorDark: '#0B1022', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  } else {
    el.innerHTML = '<div style="color:#0B1022;font-size:12px;max-width:180px;word-break:break-all">' + esc(text) + '</div>';

    homeTitle: '📲 Add the card to your home screen', copy: 'Copy link', share: 'Share', copied: 'Copied ✓',
    home: '<b>iPhone (Safari):</b> tap Share ⬆️ then "Add to Home Screen".<br><b>Android (Chrome):</b> tap ⋮ then "Add to Home screen".<br>This link is private — do not share it.',
    contact: 'Chat with MOBILY on WhatsApp', community: 'Join MOBILY Community', expiring: function (n, d) { return n + ' points expire on ' + d; },
    nextTier: function (n, t) { return n + ' more points to reach ' + t; }, suspended: 'Your membership is suspended. Please contact the shop.',
    types: { EARN: 'Purchase points', REDEEM: 'Reward redeemed', ADJUST_ADD: 'Added by staff', ADJUST_SUB: 'Deducted by staff', REVERSAL: 'Invoice cancelled', REDEEM_REVERSAL: 'Points returned', EXPIRE: 'Expired' },
    void: 'void', disc: 'discount' }
};
function tx() { return L[LANG] || L.ar; }

function render() {
  var S = D.settings, x = tx(), c = D.customer, P = D.points, en = LANG === 'en';
  document.documentElement.lang = LANG; document.documentElement.dir = en ? 'ltr' : 'rtl'; document.body.dir = document.documentElement.dir;
  $('#logo').innerHTML = ''; $('#logo').insertAdjacentHTML('afterend', ''); var _bb = document.querySelector('.brandbar'); if (!document.getElementById('heroLogo')) { _bb.insertAdjacentHTML('afterend', '<div id="heroLogo"></div>'); } $('#heroLogo').innerHTML = heroLogoHtml(S, true);
  if (S.english_enabled) $('#langBtn').classList.remove('hidden');
  $('#langBtn').textContent = en ? 'العربية' : 'English';
  var tierName = S.tiers_enabled && D.tier.id ? (en ? D.tier.name_en : D.tier.name_ar) : x.member;
  var tierStyle = S.tiers_enabled && D.tier.color ? ' style="color:' + esc(D.tier.color) + ';border-color:' + esc(D.tier.color) + '"' : '';

  $('#suspended').classList.toggle('hidden', c.status === 'active');
  $('#suspended').textContent = x.suspended;

  $('#card').innerHTML =
    '<div class="top"><div class="brand"><i class="bm">' + LOGO_MARK + '</i><div>' + esc(S.shop_name) + '<span>CLUB</span></div></div><div class="tier"' + tierStyle + '>' + esc(tierName) + '</div></div>' +
    '<div class="chipicon"></div><div class="tag">' + esc(S.tagline) + '</div>' +
    '<div class="mid"><div><div class="name">' + esc(c.name) + '</div><div class="mno">' + esc(String(c.member_no).replace(/(\d{3})(?=\d)/g, '$1 ')) + '</div></div>' +
    '<div class="pts" id="ptsVal">' + fmtNum(P.available, 'en') + '<small>' + x.points + '</small></div></div>';

  $('#qrHint').textContent = x.qrHint;
  var commLink = /^https:\/\/chat\.whatsapp\.com\/\S+$/.test(String(S.wa_community_link || '').trim()) ? String(S.wa_community_link).trim() : '';
  $('#commJoin').innerHTML = ICONS.community + ' ' + x.community;
  if (commLink) { $('#commJoin').href = commLink; $('#commJoin').classList.remove('hidden'); } else { $('#commJoin').removeAttribute('href'); $('#commJoin').classList.add('hidden'); }
  $('#stats').innerHTML =
    '<div class="stat"><b>' + fmtNum(P.available, 'en') + '</b><span>' + x.available + '</span></div>' +
    '<div class="stat"><b>' + fmtNum(P.earned_total, 'en') + '</b><span>' + x.earned + '</span></div>' +
    '<div class="stat"><b>' + fmtNum(P.redeemed_total, 'en') + '</b><span>' + x.used + '</span></div>';

  var rp = '';
  if (S.redemption_enabled && P.required > 0) {
    if (P.rewards_available > 0) {
      rp += '<div class="reward"><div class="ic">' + ICONS.gift + '</div><div><b>' + esc(x.rewardReady(P.rewards_available, S.discount_percent)) + '</b><div class="small muted">' + x.rewardShow + '</div></div></div>';
    }
    var pct = Math.round(P.progress / P.required * 100);
    rp += '<div style="margin-top:' + (rp ? 14 : 0) + 'px"><b>' + esc(x.toNext(P.to_next_reward, S.discount_percent)) + '</b>' +
      '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
      '<div class="small muted">' + esc(x.earnRule(S.amount_per_point, S.currency)) +
      (S.max_discount_amount > 0 ? ' · ' + x.maxDisc + ' ' + S.max_discount_amount + ' ' + esc(S.currency) : '') +
      (S.min_invoice_amount > 0 ? ' · ' + x.minInv + ' ' + S.min_invoice_amount + ' ' + esc(S.currency) : '') + '</div></div>';
  }
  if (D.next_tier) rp += '<div class="small" style="margin-top:10px">⭐ ' + esc(x.nextTier(D.next_tier.need, en ? D.next_tier.name_en : D.next_tier.name_ar)) + '</div>';
  (P.expiring_soon || []).forEach(function (e) { rp += '<div class="small" style="color:var(--warn);margin-top:6px">⏳ ' + esc(x.expiring(e.points, fmtDate(e.expires_at, LANG))) + '</div>'; });
  $('#rewardPanel').innerHTML = rp;
  $('#rewardPanel').style.display = rp ? '' : 'none';

  var oh = '';
  if (D.birthday) {
    var B = D.birthday;
    oh += '<div class="bday' + (B.status === 'used' ? ' used' : '') + '" id="bdayBox"><div class="bday-ic">🎂</div><div><b>' + (en ? 'Happy birthday, ' : 'كل سنة وانت طيب يا ') + esc(c.name) + '!</b>' +
      (B.status === 'used' ? '<div class="small">' + (en ? 'You used your birthday gift ✓' : 'استخدمت هدية عيد ميلادك ✓') + '</div>'
        : '<div>' + (en ? 'Your birthday gift: ' : 'هدية عيد ميلادك: ') + '<b>' + esc(B.offer_text) + '</b></div><div class="small">⏳ ' + x.until + ' ' + esc(fmtDate(B.end + 'T12:00:00', LANG)) + ' · ' + (en ? 'show this card at the shop' : 'اعرض الكارت ده في المحل') + '</div>') +
      '</div></div>';
  }
  oh += '<h2 style="margin-top:20px">' + x.offers + '</h2>';
  if (!D.offers.length) oh += '<div class="panel empty">' + x.noOffers + '</div>';
  D.offers.forEach(function (o) {
    oh += '<div class="offer' + (o.offer_id === BOOT.focusOffer ? ' focus' : '') + '" id="offer-' + esc(o.offer_id) + '">' +
      (o.image_url ? '<img src="' + esc(o.image_url) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : '') +
      '<div class="b"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3 style="margin:0">' + esc(o.title) + '</h3>' +
      '</div>' +
      (o.description ? '<div class="small" style="margin-top:4px;white-space:pre-line">' + esc(o.description) + '</div>' : '') +
      (o.end_date ? '<div class="small muted" style="margin-top:6px">⏳ ' + x.until + ' ' + esc(fmtDate(o.end_date, LANG)) + '</div>' : '') +
      '</div></div>';
  });
  $('#offersWrap').innerHTML = oh;

  $('#tabPoints').textContent = x.pointsTab; $('#tabPurchases').textContent = x.purchasesTab;
  $('#histPoints').innerHTML = D.ledger.length ? D.ledger.map(function (e) {
    return '<div class="it"><div class="l"><div>' + esc(x.types[e.type] || e.type) + '</div><small>' + esc(fmtDate(e.date, LANG, true)) +
      (e.invoice_no ? ' · ' + x.invoice + ' ' + esc(e.invoice_no) : '') + '</small></div><div class="' + (e.points >= 0 ? 'pos' : 'neg') + '">' + (e.points > 0 ? '+' : '') + e.points + '</div></div>';
  }).join('') : '<div class="empty">' + x.noHist + '</div>';
  $('#histPurchases').innerHTML = D.transactions.length ? D.transactions.map(function (t) {
    return '<div class="it"><div class="l"><div>' + fmtNum(t.net, LANG) + ' ' + esc(S.currency) + (t.status === 'void' ? ' <span class="badge red">' + x.void + '</span>' : '') +
      (t.discount > 0 ? ' <span class="badge gold">' + x.disc + ' ' + fmtNum(t.discount, LANG) + '</span>' : '') + '</div><small>' +
      esc(fmtDate(t.date, LANG, true)) + ' · ' + x.invoice + ' ' + esc(t.invoice_no) + (t.category ? ' · ' + esc(t.category) : '') + '</small></div><div class="pos">+' + t.points + '</div></div>';
  }).join('') : '<div class="empty">' + x.noHist + '</div>';

  $('#waTitle').textContent = x.waTitle;
  $('#waToggle').checked = !!c.wa_opt_in;
  $('#waDesc').textContent = c.wa_opt_in ? x.waOn : x.waOff;

  $('#homeTitle').textContent = x.homeTitle; $('#homeBody').innerHTML = x.home;
  $('#copyBtn').innerHTML = ICONS.copy + ' ' + x.copy; $('#shareBtn').innerHTML = ICONS.share + ' ' + x.share;
  $('#waContact').innerHTML = ICONS.wa + ' ' + x.contact;
  $('#waContact').href = waContactLink(S, (en ? 'Hello, my MOBILY CLUB member number is ' : 'أهلاً، رقم عضويتي في MOBILY CLUB هو ') + c.member_no);
  $('#footer').innerHTML = esc(S.program_name) + ' · <span style="direction:ltr;display:inline-block">' + esc(S.tagline) + '</span><br>' + esc(S.shop_name_ar || S.shop_name) + ' · ' + esc(S.shop_phone) + (S.shop_address ? '<br>' + esc(S.shop_address) : '');
}

renderQR($('#qr'), D.card_url, 190);
render();
if (BOOT.focusOffer) setTimeout(function () { var el = document.getElementById('offer-' + BOOT.focusOffer); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300);

$all('.tabs button').forEach(function (b) {
  b.onclick = function () {
    $all('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    $('#histPoints').classList.toggle('hidden', b.dataset.tab !== 'points');
    $('#histPurchases').classList.toggle('hidden', b.dataset.tab !== 'purchases');
  };
});
$('#langBtn').onclick = function () { LANG = LANG === 'en' ? 'ar' : 'en'; store('mc_lang', LANG); render(); };
$('#refreshBtn').onclick = function () {
  $('#refreshBtn').innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px"></span>';
  api('publicApi', 'card', { token: TOKEN }).then(function (d) { D = d; render(); }).catch(function (e) { alertBox(e.message); })
    .then(function () { $('#refreshBtn').textContent = '⟳'; });
};
$('#waToggle').onchange = function () {
  var on = $('#waToggle').checked;
  api('publicApi', 'consent', { token: TOKEN, optIn: on }).then(function () {
    D.customer.wa_opt_in = on; $('#waDesc').textContent = on ? tx().waOn : tx().waOff; $('#waMsg').textContent = tx().saved;
  }).catch(function (e) { $('#waToggle').checked = !on; $('#waMsg').textContent = e.message; });
};
$('#copyBtn').onclick = function () { copyText(D.card_url).then(function () { $('#copyBtn').textContent = tx().copied; }); };
$('#shareBtn').onclick = function () {
  var title = D.settings.program_name, text = title + '\n' + D.card_url;
  var plain = function () {
    if (navigator.share) return navigator.share({ title: title, url: D.card_url }).catch(function () { });
    copyText(D.card_url).then(function () { $('#shareBtn').textContent = tx().copied; });
  };
  if (!navigator.share || !window.File || !navigator.canShare) return plain();
  fetch('share-logo.png').then(function (r) { if (!r.ok) throw new Error('no logo'); return r.blob(); }).then(function (b) {
    var f = new File([b], 'mobily.png', { type: 'image/png' });
    if (!navigator.canShare({ files: [f] })) return plain();
    return navigator.share({ files: [f], title: title, text: text }).catch(function () { });
  }).catch(plain);
};
function alertBox(m) { $('#waMsg').textContent = m; }
</script>
</body>
</html>
